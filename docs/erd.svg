<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 1350" width="100%" height="100%" style="background:#FFFFFF; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="crowMany" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title & Metadata -->
  <text x="60" y="48" fill="#0F172A" font-size="20" font-weight="700" letter-spacing="-0.01em">JPTL Database Schema — Entity Relationship Diagram</text>
  <text x="60" y="70" fill="#64748B" font-size="12" font-weight="500">16 Data Models • Standard Crow's Foot &amp; Orthogonal Architecture</text>

  <!-- Connectors -->
  <!-- User to Property -->
  <path d="M 340 180 L 440 180" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#crowMany)"/>
  <text x="365" y="172" fill="#475569" font-size="10" font-weight="600">owns</text>

  <!-- Property to Unit -->
  <path d="M 720 180 L 820 180" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#crowMany)"/>
  <text x="745" y="172" fill="#475569" font-size="10" font-weight="600">contains</text>

  <!-- Unit to Lease -->
  <path d="M 960 410 L 960 490" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#crowMany)"/>
  <text x="968" y="455" fill="#475569" font-size="10" font-weight="600">leased</text>

  <!-- Lease to ExtensionRequest -->
  <path d="M 1100 620 L 1200 620" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#crowMany)"/>
  <text x="1115" y="612" fill="#475569" font-size="10" font-weight="600">extensions</text>

  <!-- Unit to Ticket -->
  <path d="M 1100 200 L 1200 200" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#crowMany)"/>
  <text x="1125" y="192" fill="#475569" font-size="10" font-weight="600">repairs</text>

  <!-- Ticket to StatusHistory -->
  <path d="M 1480 200 L 1580 200" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#crowMany)"/>
  <text x="1495" y="192" fill="#475569" font-size="10" font-weight="600">history</text>

  <!-- Unit to Payment -->
  <path d="M 820 590 L 720 590" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#crowMany)"/>
  <text x="745" y="582" fill="#475569" font-size="10" font-weight="600">rent</text>

  <!-- User to TenantProfile -->
  <path d="M 200 410 L 200 490" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#crowMany)"/>
  <text x="208" y="455" fill="#475569" font-size="10" font-weight="600">profile</text>

  <!-- User to SessionLog -->
  <path d="M 200 780 L 200 870" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#crowMany)"/>
  <text x="208" y="830" fill="#475569" font-size="10" font-weight="600">sessions</text>

  <!-- User to AuditLog -->
  <path d="M 340 980 L 440 980" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#crowMany)"/>
  <text x="365" y="972" fill="#475569" font-size="10" font-weight="600">acts</text>


  <!-- ══════ TABLES ══════ -->

  <!-- 1. USER -->
  <g transform="translate(60, 100)" filter="url(#cardShadow)">
    <rect width="280" height="310" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="280" height="32" rx="4" fill="#1E293B"/>
    <rect y="24" width="280" height="8" fill="#1E293B"/>
    <text x="12" y="21" fill="#FFFFFF" font-size="12" font-weight="700">USER</text>
    <text x="235" y="21" fill="#94A3B8" font-size="10" font-family="monospace">users</text>
    <g transform="translate(12, 50)" font-size="11" font-family="Consolas,monospace" fill="#1E293B">
      <text y="0"><tspan fill="#B45309" font-weight="700">PK</tspan>   _id : ObjectId</text>
      <text y="18"><tspan fill="#0369A1" font-weight="700">UK</tspan>   email : String</text>
      <text y="36">     firstName, lastName : String</text>
      <text y="54">     password : String</text>
      <text y="72">     role : String</text>
      <text y="90">     plan : String</text>
      <text y="108">     onboardingCompleted : Boolean</text>
      <text y="126"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   landlord : ObjectId</text>
      <text y="144">     status : String</text>
      <text y="162">     avatarUrl : String</text>
      <text y="180">     createdAt : Date</text>
    </g>
  </g>

  <!-- 2. PROPERTY -->
  <g transform="translate(440, 100)" filter="url(#cardShadow)">
    <rect width="280" height="240" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="280" height="32" rx="4" fill="#1E293B"/>
    <rect y="24" width="280" height="8" fill="#1E293B"/>
    <text x="12" y="21" fill="#FFFFFF" font-size="12" font-weight="700">PROPERTY</text>
    <g transform="translate(12, 50)" font-size="11" font-family="Consolas,monospace" fill="#1E293B">
      <text y="0"><tspan fill="#B45309" font-weight="700">PK</tspan>   _id : ObjectId</text>
      <text y="18">     name : String</text>
      <text y="36">     address, city : String</text>
      <text y="54">     unitsCount : Number</text>
      <text y="72">     occupancyRate : Number</text>
      <text y="90">     category : String</text>
      <text y="108">     featured : Boolean</text>
      <text y="126"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   landlord : ObjectId</text>
      <text y="144">     createdAt : Date</text>
    </g>
  </g>

  <!-- 3. UNIT -->
  <g transform="translate(820, 100)" filter="url(#cardShadow)">
    <rect width="280" height="310" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="280" height="32" rx="4" fill="#1E293B"/>
    <rect y="24" width="280" height="8" fill="#1E293B"/>
    <text x="12" y="21" fill="#FFFFFF" font-size="12" font-weight="700">UNIT</text>
    <g transform="translate(12, 50)" font-size="11" font-family="Consolas,monospace" fill="#1E293B">
      <text y="0"><tspan fill="#B45309" font-weight="700">PK</tspan>   _id : ObjectId</text>
      <text y="18">     label : String (Unit 14B)</text>
      <text y="36"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   property : ObjectId</text>
      <text y="54"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   tenant : ObjectId</text>
      <text y="72">     monthlyRent : Number</text>
      <text y="90">     sqft : Number</text>
      <text y="108">     status : String</text>
      <text y="126">     hasParking : Boolean</text>
      <text y="144">     parkingSpot : String</text>
      <text y="162">     parkingFee : Number</text>
      <text y="180">     leaseStart, leaseEnd : Date</text>
    </g>
  </g>

  <!-- 4. TICKET -->
  <g transform="translate(1200, 100)" filter="url(#cardShadow)">
    <rect width="280" height="230" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="280" height="32" rx="4" fill="#1E293B"/>
    <rect y="24" width="280" height="8" fill="#1E293B"/>
    <text x="12" y="21" fill="#FFFFFF" font-size="12" font-weight="700">TICKET</text>
    <g transform="translate(12, 50)" font-size="11" font-family="Consolas,monospace" fill="#1E293B">
      <text y="0"><tspan fill="#B45309" font-weight="700">PK</tspan>   _id : ObjectId</text>
      <text y="18">     title : String</text>
      <text y="36">     description : String</text>
      <text y="54">     category : String</text>
      <text y="72">     priority : String</text>
      <text y="90">     status : String</text>
      <text y="108"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   unit : ObjectId</text>
      <text y="126"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   tenant : ObjectId</text>
    </g>
  </g>

  <!-- 5. TICKET_STATUS_HISTORY -->
  <g transform="translate(1580, 100)" filter="url(#cardShadow)">
    <rect width="280" height="170" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="280" height="32" rx="4" fill="#475569"/>
    <rect y="24" width="280" height="8" fill="#475569"/>
    <text x="12" y="21" fill="#FFFFFF" font-size="12" font-weight="700">TICKET_STATUS_HISTORY</text>
    <g transform="translate(12, 50)" font-size="11" font-family="Consolas,monospace" fill="#1E293B">
      <text y="0">     status : String</text>
      <text y="18"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   changedBy : ObjectId</text>
      <text y="36">     userRole : String</text>
      <text y="54">     note : String</text>
      <text y="72">     timestamp : Date</text>
    </g>
  </g>

  <!-- 6. TENANT_PROFILE -->
  <g transform="translate(60, 490)" filter="url(#cardShadow)">
    <rect width="280" height="290" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="280" height="32" rx="4" fill="#1E293B"/>
    <rect y="24" width="280" height="8" fill="#1E293B"/>
    <text x="12" y="21" fill="#FFFFFF" font-size="12" font-weight="700">TENANT_PROFILE</text>
    <g transform="translate(12, 50)" font-size="11" font-family="Consolas,monospace" fill="#1E293B">
      <text y="0"><tspan fill="#B45309" font-weight="700">PK</tspan>   _id : ObjectId</text>
      <text y="18"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   user : ObjectId (UK)</text>
      <text y="36"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   property, unit : ObjectId</text>
      <text y="54">     monthlyRent, parkingFee : Num</text>
      <text y="72">     leaseStart, leaseEnd : Date</text>
      <text y="90">     status : String</text>
      <text y="108">     autoPayEnabled : Boolean</text>
      <text y="126">     securityDeposit : Number</text>
    </g>
  </g>

  <!-- 7. PAYMENT -->
  <g transform="translate(440, 490)" filter="url(#cardShadow)">
    <rect width="280" height="290" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="280" height="32" rx="4" fill="#1E293B"/>
    <rect y="24" width="280" height="8" fill="#1E293B"/>
    <text x="12" y="21" fill="#FFFFFF" font-size="12" font-weight="700">PAYMENT</text>
    <g transform="translate(12, 50)" font-size="11" font-family="Consolas,monospace" fill="#1E293B">
      <text y="0"><tspan fill="#B45309" font-weight="700">PK</tspan>   _id : ObjectId</text>
      <text y="18"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   tenant : ObjectId</text>
      <text y="36"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   unit, property : ObjectId</text>
      <text y="54">     amount : Number</text>
      <text y="72">     dueDate, paidAt : Date</text>
      <text y="90">     status : String</text>
      <text y="108">     period, method : String</text>
      <text y="126">     isAdvancePayment : Boolean</text>
    </g>
  </g>

  <!-- 8. LEASE -->
  <g transform="translate(820, 490)" filter="url(#cardShadow)">
    <rect width="280" height="290" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="280" height="32" rx="4" fill="#1E293B"/>
    <rect y="24" width="280" height="8" fill="#1E293B"/>
    <text x="12" y="21" fill="#FFFFFF" font-size="12" font-weight="700">LEASE</text>
    <g transform="translate(12, 50)" font-size="11" font-family="Consolas,monospace" fill="#1E293B">
      <text y="0"><tspan fill="#B45309" font-weight="700">PK</tspan>   _id : ObjectId</text>
      <text y="18"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   tenant : ObjectId</text>
      <text y="36"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   landlord : ObjectId</text>
      <text y="54"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   property, unit : ObjectId</text>
      <text y="72">     leaseStart, leaseEnd : Date</text>
      <text y="90">     monthlyRent, deposit : Number</text>
      <text y="108">     status : String</text>
      <text y="126">     contractPdfUrl : String</text>
    </g>
  </g>

  <!-- 9. EXTENSION_REQUEST -->
  <g transform="translate(1200, 490)" filter="url(#cardShadow)">
    <rect width="280" height="250" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="280" height="32" rx="4" fill="#475569"/>
    <rect y="24" width="280" height="8" fill="#475569"/>
    <text x="12" y="21" fill="#FFFFFF" font-size="12" font-weight="700">EXTENSION_REQUEST</text>
    <g transform="translate(12, 50)" font-size="11" font-family="Consolas,monospace" fill="#1E293B">
      <text y="0"><tspan fill="#B45309" font-weight="700">PK</tspan>   _id : ObjectId</text>
      <text y="18">     termMonths : Number</text>
      <text y="36">     proposedStartDate : Date</text>
      <text y="54">     proposedEndDate : Date</text>
      <text y="72">     monthlyRent : Number</text>
      <text y="90">     status : String</text>
      <text y="108"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   reviewedBy : ObjectId</text>
    </g>
  </g>

  <!-- 10. DOCUMENT -->
  <g transform="translate(1580, 490)" filter="url(#cardShadow)">
    <rect width="280" height="250" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="280" height="32" rx="4" fill="#1E293B"/>
    <rect y="24" width="280" height="8" fill="#1E293B"/>
    <text x="12" y="21" fill="#FFFFFF" font-size="12" font-weight="700">DOCUMENT</text>
    <g transform="translate(12, 50)" font-size="11" font-family="Consolas,monospace" fill="#1E293B">
      <text y="0"><tspan fill="#B45309" font-weight="700">PK</tspan>   _id : ObjectId</text>
      <text y="18"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   tenant : ObjectId</text>
      <text y="36"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   unit : ObjectId</text>
      <text y="54">     name : String</text>
      <text y="72">     type, category : String</text>
      <text y="90">     status : String</text>
    </g>
  </g>

  <!-- 11. SESSION_LOG -->
  <g transform="translate(60, 870)" filter="url(#cardShadow)">
    <rect width="280" height="220" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="280" height="32" rx="4" fill="#1E293B"/>
    <rect y="24" width="280" height="8" fill="#1E293B"/>
    <text x="12" y="21" fill="#FFFFFF" font-size="12" font-weight="700">SESSION_LOG</text>
    <g transform="translate(12, 50)" font-size="11" font-family="Consolas,monospace" fill="#1E293B">
      <text y="0"><tspan fill="#B45309" font-weight="700">PK</tspan>   _id : ObjectId</text>
      <text y="18"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   userId : ObjectId</text>
      <text y="36">     email, role : String</text>
      <text y="54">     ip, userAgent : String</text>
      <text y="72">     loginAt, logoutAt : Date</text>
      <text y="90">     isActive : Boolean</text>
    </g>
  </g>

  <!-- 12. AUDIT_LOG -->
  <g transform="translate(440, 870)" filter="url(#cardShadow)">
    <rect width="280" height="210" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="280" height="32" rx="4" fill="#1E293B"/>
    <rect y="24" width="280" height="8" fill="#1E293B"/>
    <text x="12" y="21" fill="#FFFFFF" font-size="12" font-weight="700">AUDIT_LOG</text>
    <g transform="translate(12, 50)" font-size="11" font-family="Consolas,monospace" fill="#1E293B">
      <text y="0"><tspan fill="#B45309" font-weight="700">PK</tspan>   _id : ObjectId</text>
      <text y="18"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   actor : ObjectId</text>
      <text y="36">     actorRole, action : String</text>
      <text y="54">     entityKind : String</text>
      <text y="72"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   entityId : ObjectId</text>
    </g>
  </g>

  <!-- 13. ANNOUNCEMENT -->
  <g transform="translate(820, 870)" filter="url(#cardShadow)">
    <rect width="280" height="180" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="280" height="32" rx="4" fill="#1E293B"/>
    <rect y="24" width="280" height="8" fill="#1E293B"/>
    <text x="12" y="21" fill="#FFFFFF" font-size="12" font-weight="700">ANNOUNCEMENT</text>
    <g transform="translate(12, 50)" font-size="11" font-family="Consolas,monospace" fill="#1E293B">
      <text y="0"><tspan fill="#B45309" font-weight="700">PK</tspan>   _id : ObjectId</text>
      <text y="18">     title, content : String</text>
      <text y="36">     category : String</text>
      <text y="54">     isPinned : Boolean</text>
      <text y="72"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   author : ObjectId</text>
    </g>
  </g>

  <!-- 14. NOTIFICATION -->
  <g transform="translate(1200, 870)" filter="url(#cardShadow)">
    <rect width="280" height="190" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="280" height="32" rx="4" fill="#1E293B"/>
    <rect y="24" width="280" height="8" fill="#1E293B"/>
    <text x="12" y="21" fill="#FFFFFF" font-size="12" font-weight="700">NOTIFICATION</text>
    <g transform="translate(12, 50)" font-size="11" font-family="Consolas,monospace" fill="#1E293B">
      <text y="0"><tspan fill="#B45309" font-weight="700">PK</tspan>   _id : ObjectId</text>
      <text y="18"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   user : ObjectId</text>
      <text y="36">     title, body, type : String</text>
      <text y="54">     read : Boolean</text>
      <text y="72">     refModel, refId : Ref</text>
    </g>
  </g>

  <!-- 15. PUSH_SUBSCRIPTION -->
  <g transform="translate(1580, 870)" filter="url(#cardShadow)">
    <rect width="240" height="140" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="240" height="32" rx="4" fill="#1E293B"/>
    <rect y="24" width="240" height="8" fill="#1E293B"/>
    <text x="12" y="21" fill="#FFFFFF" font-size="12" font-weight="700">PUSH_SUBSCRIPTION</text>
    <g transform="translate(12, 50)" font-size="11" font-family="Consolas,monospace" fill="#1E293B">
      <text y="0"><tspan fill="#B45309" font-weight="700">PK</tspan>   _id : ObjectId</text>
      <text y="18"><tspan fill="#6D28D9" font-weight="700">FK</tspan>   user : ObjectId</text>
      <text y="36">     endpoint : String</text>
    </g>
  </g>

  <!-- 16. SYSTEM_SETTING -->
  <g transform="translate(1840, 870)" filter="url(#cardShadow)">
    <rect width="220" height="140" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="220" height="32" rx="4" fill="#1E293B"/>
    <rect y="24" width="220" height="8" fill="#1E293B"/>
    <text x="12" y="21" fill="#FFFFFF" font-size="12" font-weight="700">SYSTEM_SETTING</text>
    <g transform="translate(12, 50)" font-size="11" font-family="Consolas,monospace" fill="#1E293B">
      <text y="0"><tspan fill="#B45309" font-weight="700">PK</tspan>   _id : ObjectId</text>
      <text y="18"><tspan fill="#0369A1" font-weight="700">UK</tspan>   key : String</text>
      <text y="36">     value : Mixed</text>
    </g>
  </g>

  <!-- Enterprise Legend -->
  <g transform="translate(60, 1140)">
    <rect width="2000" height="50" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="24" y="30" fill="#0F172A" font-size="12" font-weight="700">NOTATION LEGEND:</text>
    <text x="160" y="30" fill="#B45309" font-size="11" font-weight="700">[PK] Primary Key</text>
    <text x="290" y="30" fill="#6D28D9" font-size="11" font-weight="700">[FK] Foreign Key</text>
    <text x="420" y="30" fill="#0369A1" font-size="11" font-weight="700">[UK] Unique Key</text>
    <line x1="560" y1="26" x2="600" y2="26" stroke="#475569" stroke-width="1.5"/>
    <text x="610" y="30" fill="#475569" font-size="11">Standard Relation (1 : N)</text>
    <line x1="770" y1="26" x2="810" y2="26" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="820" y="30" fill="#475569" font-size="11">Embedded / Subdocument</text>
  </g>
</svg>
